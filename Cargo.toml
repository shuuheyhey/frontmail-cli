[package]
name = "frontmail-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fast, read-only, script-friendly CLI for the Front API"
license = "MIT"
repository = "https://github.com/shuuheyhey/frontmail-cli"
readme = "README.md"
keywords = ["front", "cli", "customer-support", "automation"]
categories = ["command-line-utilities"]

[[bin]]
name = "front"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.47", features = ["derive"] }
clap_complete = "4.5.57"
directories = "6.0.0"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.7"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"
wiremock = "0.6.5"

[profile.release]
strip = true
lto = "thin"
